name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build project
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found in the repository."
            exit 1
          fi
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project folder at: $DIR"
          chmod +x "$GRADLEW_PATH"
          cd "$DIR"
          ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: inspectitems-1.21.11
          path: '**/build/libs/*.jar'
